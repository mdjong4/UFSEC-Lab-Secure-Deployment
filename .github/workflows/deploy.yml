name: Build and Deploy
on: 
  workflow_dispatch: 
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          permissions:
          contents: read
          security-events: write
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
      - name: Build image
        run: |
          docker build -t myapp:latest .
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
            creds: ${{secrets.AZURE_CREDENTIALS}}
      - name: Push to ACR
        run: |
          az acr login -n labdeployacrmj
          docker tag myapp:latest labdeployacrmj.azurecr.io/myapp:latest
          docker push labdeployacrmj.azurecr.io/myapp:latest
      - name: Deploy to WebApp
        run: |
          az webapp config container set \
          -g RGLabDeploy \
          -n labdeploy-webappmj \
          --container-image-name labdeployacrmj.azurecr.io/myapp:latest \
          --container-registry-url https://labdeployacrmj.azurecr.io \
          --container-registry-user ${{secrets.ACR_USER}} \
          --container-registry-password ${{secrets.ACR_PWD}}
